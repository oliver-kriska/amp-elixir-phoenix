name: Sync canonical Amp artifacts

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-canonical-amp-artifacts
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      base: ${{ steps.pr.outputs.base }}
      number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Checkout wrapper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oliver-kriska/claude-elixir-phoenix
          ref: main
          path: canonical

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and verify
        run: |
          npm run sync:canonical -- "$GITHUB_WORKSPACE/canonical"
          npm run sync:canonical:check -- "$GITHUB_WORKSPACE/canonical"
          rm -rf canonical

      - name: Open or update the single sync pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/sync-canonical-amp
        run: |
          if git diff --quiet && [ -z "$(git status --short)" ]; then
            echo "Canonical artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch -C "$BRANCH"
          git add canonical-commit.txt distribution-manifest.json plugins skills scripts/tests/amp_watch_pr_harness.mts
          git commit -m "Sync canonical Amp artifacts"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          expected="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "$BRANCH"

          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body=$'## Summary\n\n- Sync generated Amp skills and the native PR watcher from canonical main\n- Refresh the lifecycle harness, source revision, and distribution manifest\n\n## Delivery\n\nThe sync workflow runs the full reusable CI against this exact commit and merges only after validation succeeds. Main CI then validates the merged revision, promotes stable, and starts Amp-hosted publication.'
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Sync canonical Amp artifacts" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Sync canonical Amp artifacts" --body "$body"
            pr_number="$(gh pr view "$BRANCH" --json number --jq .number)"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

  validate:
    needs: [sync]
    if: needs.sync.outputs.sha != ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
      actions: write
    with:
      ref: ${{ needs.sync.outputs.sha }}

  deliver:
    name: Merge validated sync and start main CI
    needs: [sync, validate]
    if: >-
      !cancelled() && needs.sync.result == 'success' &&
      (needs.validate.result == 'success' ||
       (needs.validate.result == 'skipped' && needs.sync.outputs.sha == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge only the tested generated revision
        if: needs.sync.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_SHA: ${{ needs.sync.outputs.sha }}
          BASE_SHA: ${{ needs.sync.outputs.base }}
          PR_NUMBER: ${{ needs.sync.outputs.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GH_REPO" --arg sha "$SYNC_SHA" \
            '.state == "open" and .base.ref == "main" and
             .head.ref == "automation/sync-canonical-amp" and
             .head.repo.full_name == $repo and .head.sha == $sha'
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "$BASE_SHA" ]; then
            echo "Main changed during validation; the next sync will rebuild against it." >&2
            exit 1
          fi
          merged="$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$SYNC_SHA" -f merge_method=squash --jq .merged)"
          test "$merged" = true

      # GITHUB_TOKEN merges do not trigger push CI. Also retry delivery on a
      # no-change sync, so a previous dispatch or promotion failure can recover.
      - name: Dispatch main validation and promotion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
