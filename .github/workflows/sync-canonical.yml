name: Sync canonical Amp artifacts

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-canonical-amp-artifacts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout wrapper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oliver-kriska/claude-elixir-phoenix
          ref: main
          path: canonical

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and verify
        run: |
          npm run sync:canonical -- "$GITHUB_WORKSPACE/canonical"
          npm run sync:canonical:check -- "$GITHUB_WORKSPACE/canonical"
          rm -rf canonical
          npm test

      - name: Open or update the single sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/sync-canonical-amp
        run: |
          if git diff --quiet && [ -z "$(git status --short)" ]; then
            echo "Canonical artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add canonical-commit.txt distribution-manifest.json plugins skills scripts/tests/amp_watch_pr_harness.mts
          git commit -m "Sync canonical Amp artifacts"
          expected="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "$BRANCH"

          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body=$'## Summary\n\n- Sync generated Amp skills and the native PR watcher from canonical main\n- Refresh the lifecycle harness, source revision, and distribution manifest\n\n## Changes\n\nGenerated by the conservative daily canonical sync. Wrapper CI remains responsible for validation and stable promotion.'
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Sync canonical Amp artifacts" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Sync canonical Amp artifacts" --body "$body"
          fi
