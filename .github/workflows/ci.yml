name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and verify the distribution
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check whitespace
        run: git diff --check

  amp-runtime:
    name: Latest Amp runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Amp
        run: curl -fsSL https://ampcode.com/install.sh | bash

      - name: Load plugins without model calls
        run: |
          "$HOME/.amp/bin/amp" plugins exec \
            plugins/elixir-phoenix.ts \
            agent.start \
            --data '{"thread":{"id":"T-00000000-0000-0000-0000-000000000000"},"message":"native load smoke","id":"native-load"}'
          "$HOME/.amp/bin/amp" plugins exec \
            plugins/phx-watch-pr.ts \
            agent.start \
            --data '{"thread":{"id":"T-00000000-0000-0000-0000-000000000000"},"message":"watcher load smoke","id":"watcher-load"}'

  promote:
    name: Promote validated distribution
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, amp-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Promote stable to the validated commit
        run: |
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "Refusing stale promotion: main is $remote_main, validated $GITHUB_SHA" >&2
            exit 1
          fi

          expected_stable="$(git ls-remote origin refs/heads/stable | awk '{print $1}')"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "Refusing stale promotion: main changed to $remote_main" >&2
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/stable:${expected_stable}" \
            origin "${GITHUB_SHA}:refs/heads/stable"

  publish-check:
    name: Verify promoted raw plugin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare the published artifacts
        run: |
          stable_sha="$(git ls-remote --exit-code origin refs/heads/stable | awk '{print $1}')"
          if [ "$stable_sha" != "$GITHUB_SHA" ]; then
            echo "stable is $stable_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

          for plugin in elixir-phoenix.ts phx-watch-pr.ts; do
            raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${stable_sha}/plugins/${plugin}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              "$raw_url" | cmp - "plugins/${plugin}"
          done
